name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装所需 SDK 组件
        run: |
          sdkmanager "platforms;android-33" "build-tools;33.0.2" "platform-tools"
          yes | sdkmanager --licenses || true

      - name: 授予 gradlew 执行权限
        run: chmod +x ./gradlew

      - name: 编译 Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 生成签名密钥
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias joykey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass joywskeycopy -keypass joywskeycopy \
            -dname "CN=JoyWskeyCopy, OU=Dev, O=Local, L=NA, ST=NA, C=CN"

      - name: 对齐并签名 APK
        run: |
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          echo "使用 build-tools: $BUILD_TOOLS"
          APK_IN=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "输入 APK: $APK_IN"
          $BUILD_TOOLS/zipalign -v -p 4 "$APK_IN" aligned.apk
          $BUILD_TOOLS/apksigner sign \
            --ks release.keystore \
            --ks-pass pass:joywskeycopy \
            --key-pass pass:joywskeycopy \
            --ks-key-alias joykey \
            --out JoyWskeyCopy-release.apk aligned.apk
          $BUILD_TOOLS/apksigner verify --print-certs JoyWskeyCopy-release.apk

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: JoyWskeyCopy-release
          path: JoyWskeyCopy-release.apk
          if-no-files-found: error

      - name: 编译失败时导出日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            app/build/outputs/logs/
            build/reports/
          if-no-files-found: ignore
