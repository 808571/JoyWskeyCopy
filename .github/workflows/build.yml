name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 检查预装的 Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls $ANDROID_HOME/platforms/ || true
          ls $ANDROID_HOME/build-tools/ || true

      - name: 确保存在 android-33 平台
        run: |
          if [ -d "$ANDROID_HOME/platforms/android-33" ]; then
            echo "android-33 已存在，跳过安装"
          else
            echo "缺少 android-33，开始安装"
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-33" </dev/null
          fi

      - name: 授予 gradlew 执行权限
        run: chmod +x ./gradlew

      - name: 编译 Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 生成签名密钥
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias joykey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass joywskeycopy -keypass joywskeycopy \
            -dname "CN=JoyWskeyCopy, OU=Dev, O=Local, L=NA, ST=NA, C=CN"

      - name: 对齐并签名 APK
        run: |
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          echo "使用 build-tools: $BUILD_TOOLS"
          APK_IN=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "输入 APK: $APK_IN"
          $BUILD_TOOLS/zipalign -v -p 4 "$APK_IN" aligned.apk
          $BUILD_TOOLS/apksigner sign \
            --ks release.keystore \
            --ks-pass pass:joywskeycopy \
            --key-pass pass:joywskeycopy \
            --ks-key-alias joykey \
            --out JoyWskeyCopy-release.apk aligned.apk
          $BUILD_TOOLS/apksigner verify --print-certs JoyWskeyCopy-release.apk

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: JoyWskeyCopy-release
          path: JoyWskeyCopy-release.apk
          if-no-files-found: error
